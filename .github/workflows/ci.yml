name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type-check, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run type-check

      - name: Lint (errors fail the build)
        run: npx eslint . --max-warnings=1000

      - name: Production build
        # Placeholder values prove the build needs no live credentials. The real
        # values are injected by the hosting provider at deploy time.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: https://degreensacre.example.com
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Dependency audit (fail on high/critical)
        run: npm audit --omit=dev --audit-level=high
